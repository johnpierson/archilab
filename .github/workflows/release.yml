name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3 (dry run: uploads artifacts, creates no release)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-all-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-all-

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') {
              '${{ github.ref_name }}'.TrimStart('v')
          } else {
              '${{ inputs.version }}'
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Expected X.Y.Z, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Build all Revit versions
        shell: pwsh
        run: |
          foreach ($y in 2025, 2026, 2027) {
              dotnet build "archilabUI$y/archilabUI$y.csproj" -c Release -p:Version=${{ steps.ver.outputs.version }}
              if ($LASTEXITCODE -ne 0) { throw "Build failed for Revit $y" }
          }

      - name: Package
        shell: pwsh
        run: |
          foreach ($y in 2025, 2026, 2027) {
              ./scripts/package.ps1 -RevitYear $y -Version ${{ steps.ver.outputs.version }}
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dynamo-packages-${{ steps.ver.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

      # Publishing to the Dynamo Package Manager stays manual -- it has no
      # publish API. Download these zips and upload them through Dynamo.
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
