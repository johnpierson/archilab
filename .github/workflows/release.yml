name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number, e.g. 13 (dry run: uploads artifacts, creates no release)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-all-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-all-

      # The tag and the dispatch input reach the shell through env, never
      # through expression interpolation -- a crafted tag would otherwise run
      # as PowerShell before the format check could reject it.
      - name: Determine build number
        id: ver
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          $b = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_BUILD }
          if ($b -notmatch '^\d{1,2}$' -or [int]$b -lt 1) { throw "Expected a build number 1-99, got '$b'" }
          "build=$b" >> $env:GITHUB_OUTPUT

          . ./scripts/version.ps1
          foreach ($y in 2025, 2026, 2027) {
              Write-Host "Revit $y -> $(Get-ArchilabVersion -RevitYear $y -Build ([int]$b))"
          }

      # One build round produces three packages, each with its own version.
      - name: Build all Revit versions
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          . ./scripts/version.ps1
          foreach ($y in 2025, 2026, 2027) {
              $v = Get-ArchilabVersion -RevitYear $y -Build ([int]$env:BUILD_NUMBER)
              dotnet build "archilabUI$y/archilabUI$y.csproj" -c Release -p:Version=$v
              if ($LASTEXITCODE -ne 0) { throw "Build failed for Revit $y" }
          }

      - name: Package
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          foreach ($y in 2025, 2026, 2027) {
              ./scripts/package.ps1 -RevitYear $y -Build ([int]$env:BUILD_NUMBER)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dynamo-packages-${{ steps.ver.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

      # Publishing to the Dynamo Package Manager stays manual -- it has no
      # publish API. Download these zips and upload them through Dynamo.
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
